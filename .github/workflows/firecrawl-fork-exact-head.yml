name: Firecrawl fork exact-head
on:
  pull_request:
    branches: [izaiah-main]
  push:
    branches: [q1-native-firecrawl-20261009]
permissions:
  contents: read
jobs:
  sdk-and-ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.12.13'
      - name: Install search test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
      - name: Exact SDK and bridge contract
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra firecrawl --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra bedrock
          .venv/bin/python -m pytest -q tests/tools/test_firecrawl_credit_ledger.py
          .venv/bin/python -c "from importlib.metadata import version; from firecrawl import Firecrawl; assert version('firecrawl-py')=='4.49.3'; c=Firecrawl(api_key='fixture-only'); assert all(hasattr(c,n) for n in ('search','scrape','gov_search','parse','find_tools'))"
          git diff --exit-code
      - name: Codex persisted-authority refresh regressions
        run: |
          .venv/bin/python -m pytest -q tests/agent/test_credential_pool_deferred_refresh.py tests/agent/test_credential_pool_oauth_writethrough.py tests/agent/test_credential_pool_profile_oauth_fork.py tests/agent/test_credential_pool_codex_singleton_isolation.py
      - name: Full tools and provider regressions (per-file isolation)
        env:
          HERMES_TEST_PATHS: tests/tools:tests/agent/test_credential_pool.py:tests/agent/test_anthropic_credit_guard_stdin.py:tests/agent/test_nous_portal_anthropic_wire.py:tests/plugins/browser/test_firecrawl_expiry.py
          HERMES_TEST_WORKERS: '2'
          FIRECRAWL_OPERATION_LEDGER: ${{ runner.temp }}/TEST-ONLY-ledger.jsonl
        run: |
          .venv/bin/python scripts/run_tests_parallel.py -q
          git diff --exit-code
